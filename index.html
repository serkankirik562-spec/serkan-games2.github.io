<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SERKAN GAMES</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #05000f, #21003d);
    color: white;
    transition: 0.5s;
}

/* Yıldızlar */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: move 10s linear infinite;
}

@keyframes move {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(100vh);
    }
}

/* Menü */
.navbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    background: rgba(0,0,0,0.6);
    border-bottom: 2px solid #9b00ff;
    box-shadow: 0 0 20px #9b00ff;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #c000ff;
    text-shadow: 0 0 15px #c000ff;
}

/* Arama */
.search {
    width: 350px;
    padding: 12px;
    border-radius: 20px;
    border: 2px solid #9b00ff;
    background: black;
    color: white;
}

/* Saat */
.right {
    display: flex;
    gap: 15px;
    align-items: center;
}

button {
    background: #9000ff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
}

/* Ayarlar menüsü */
.settings {
    position: absolute;
    right: 20px;
    top: 80px;
    background: #12001f;
    border: 1px solid #a000ff;
    padding: 15px;
    border-radius: 15px;
    display: none;
    box-shadow: 0 0 20px purple;
}

.settings button {
    width: 150px;
    margin-top: 10px;
}


/* Gündüz modu */

.day {
    background: linear-gradient(135deg,#ffffff,#d9caff);
    color:black;
}

.day .navbar {
    background:white;
    border-color:#5500ff;
}

.day .logo {
    color:#5500ff;
    text-shadow:none;
}

</style>

</head>

<body>


<div class="navbar">

<div class="logo">
SERKAN GAMES
</div>


<input class="search" placeholder="Oyun ara...">


<div class="right">

<div id="clock">
00:00:00
</div>

<button onclick="openSettings()">
⚙️
</button>

</div>

</div>



<div class="settings" id="menu">

<h3>Ayarlar</h3>

<p>Dil Seçimi</p>

<button>
Türkçe
</button>

<p>Tema</p>

<button onclick="themeChange()">
🌙 Gece / ☀️ Gündüz
</button>

</div>



<script>

// Saat

function clock(){

let d = new Date();

document.getElementById("clock").innerHTML =
d.toLocaleTimeString("tr-TR");

}

setInterval(clock,1000);
clock();


// Ayarlar

function openSettings(){

let menu=document.getElementById("menu");

if(menu.style.display=="block")
menu.style.display="none";

else
menu.style.display="block";

}


// Tema

function themeChange(){

document.body.classList.toggle("day");

}



// Yıldız oluşturma

for(let i=0;i<100;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.animationDuration=
(5+Math.random()*10)+"s";


document.body.appendChild(star);

}


</script>


</body>
</html>
