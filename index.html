<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERKAN GAMES</title>
    <style>
        :root {
            --bg-color: #0b0614;
            --main-color: #ffffff;
            --accent-glow: #a855f7;
            --menu-bg: #151026;
        }

        body.light-mode {
            --bg-color: #ffffff;
            --main-color: #0b0614;
            --accent-glow: #7c3aed;
            --menu-bg: #f3f4f6;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        #topbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }

        #logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        #search-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
        }

        #search-input {
            width: 40%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid var(--main-color);
            background: transparent;
            color: var(--main-color);
            outline: none;
            font-size: 16px;
        }

        #right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #saat {
            font-size: 16px;
        }

        #settings-btn {
            background: none;
            border: none;
            color: var(--main-color);
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #settings-btn:hover {
            transform: rotate(90deg);
        }

        /* Menü Stili */
        #menu-dropdown {
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
            background: var(--menu-bg);
            border: 1px solid var(--main-color);
            border-radius: 8px;
            padding: 15px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
            width: 200px;
        }

        .menu-section {
            margin-bottom: 15px;
        }

        .menu-section h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--main-color);
            padding-bottom: 4px;
        }

        .menu-section select, .menu-section button {
            width: 100%;
            padding: 6px;
            background: transparent;
            color: var(--main-color);
            border: 1px solid var(--main-color);
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }

        #center-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 45px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* Yıldızlar Efekti */
        #yildizlar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--main-color);
            opacity: 0.8;
            box-shadow: 0 0 6px var(--accent-glow);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>

    <div id="yildizlar"></div>

    <div id="topbar">
        <div id="logo">SERKAN GAMES</div>
        
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Oyun ara...">
        </div>

        <div id="right-controls">
            <div id="saat">00:00</div>
            <button id="settings-btn" onclick="toggleMenu()">⚙️</button>
        </div>

        <!-- Açılır Ayarlar Menüsü -->
        <div id="menu-dropdown">
            <div class="menu-section">
                <h4 id="lang-title">Dil Seçimi</h4>
                <select id="language-select" onchange="changeLanguage()">
                    <option value="tr">Türkçe</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="az">Azərbaycan</option>
                </select>
            </div>
            <div class="menu-section">
                <h4 id="theme-title">Tema</h4>
                <button onclick="toggleTheme()" id="theme-btn">Gece / Gündüz Modu</button>
            </div>
        </div>
    </div>

    <div id="center-content">
        <h1 id="main-title">SERKAN GAMES</h1>
    </div>

    <script>
        // Saat Güncelleme
        function updateClock() {
            const now = new Date();
            document.getElementById('saat').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Yıldız Efekti Oluşturma
        const yildizContainer = document.getElementById('yildizlar');
        function createStar() {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = Math.random() * window.innerWidth + 'px';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.opacity = Math.random();
            yildizContainer.appendChild(star);

            setTimeout(() => {
                star.remove();
            }, 5000);
        }
        setInterval(createStar, 80);

        // Menü Aç/Kapat
        function toggleMenu() {
            const menu = document.getElementById('menu-dropdown');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // Gündüz / Gece Modu (Renkleri Tersine Çevirme)
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // Basit Dil Değiştirme Örneği
        function changeLanguage() {
            const lang = document.getElementById('language-select').value;
            const searchInput = document.getElementById('search-input');
            const langTitle = document.getElementById('lang-title');
            const themeTitle = document.getElementById('theme-title');
            const themeBtn = document.getElementById('theme-btn');

            if (lang === 'en') {
                searchInput.placeholder = "Search game...";
                langTitle.innerText = "Language";
                themeTitle.innerText = "Theme";
                themeBtn.innerText = "Day / Night Mode";
            } else if (lang === 'ja') {
                searchInput.placeholder = "ゲームを検索...";
                langTitle.innerText = "言語";
                themeTitle.innerText = "テーマ";
                themeBtn.innerText = "昼/夜モード";
            } else if (lang === 'az') {
                searchInput.placeholder = "Oyun axtar...";
                langTitle.innerText = "Dil Seçimi";
                themeTitle.innerText = "Tema";
                themeBtn.innerText = "Gecə / Gündüz Rejimi";
            } else {
                searchInput.placeholder = "Oyun ara...";
                langTitle.innerText = "Dil Seçimi";
                themeTitle.innerText = "Tema";
                themeBtn.innerText = "Gece / Gündüz Modu";
            }
        }
    </script>
</body>
    </html>
